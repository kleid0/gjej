name: Refresh Prices

# Scrapes the ENTIRE price catalogue inside the GitHub Actions runner
# (scripts/refresh-prices.ts) and commits the updated data/*.json back to main.
#
# Previously this workflow only *triggered* the scrape by calling the Vercel
# function /api/cron/refresh-prices in a ~250-iteration loop, so all the
# scraping CPU (HTTP + cheerio parsing) counted against Vercel's Fluid Active
# CPU budget — which is what nearly blew the limit. Running the scrape here
# instead keeps Vercel out of the scraping path entirely. The resulting
# `chore(data,deploy):` commit is the one prefix vercel.json's ignoreCommand
# lets through, so Vercel does exactly ONE rebuild to publish the fresh data.
#
# Because process.env.VERCEL is unset in the runner, the JsonStore layer reads
# and writes data/*.json directly in the checkout — no /tmp, no GitHub-API
# commit dance, no revalidateTag needed.
#
# Triggers:
#   - workflow_dispatch (manual)
#   - schedule (daily 06:00 UTC)
#   - push to main on .github/triggers/refresh-prices.txt (on-demand sentinel)
#
# Secrets — all OPTIONAL. Without them the refresh still runs; it just won't
# send price-drop emails (the alert lookup no-ops without a database):
#   - POSTGRES_URL or DATABASE_URL : enables price-alert lookups
#   - RESEND_API_KEY               : enables sending price-drop emails

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Scrape only the first N products (blank/0 = whole catalogue)"
        required: false
        default: ""
      dry_run:
        description: "Scrape but do NOT commit/push the results (test run)"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/triggers/refresh-prices.txt"

# Never run two catalogue walks at once.
concurrency:
  group: refresh-prices
  cancel-in-progress: false

# Needed so the built-in GITHUB_TOKEN can push the data commit back to main.
permissions:
  contents: write

jobs:
  refresh:
    name: Scrape catalogue and commit
    runs-on: ubuntu-latest
    timeout-minutes: 350 # ~6h GHA cap minus a safety margin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh prices
        env:
          # All optional — see header. Passed through to the runner process.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Optional sample size (workflow_dispatch only); empty on schedule.
          REFRESH_LIMIT: ${{ inputs.limit }}
          # Keep the run log readable; the in-memory persist buffer is bounded
          # regardless, and info-level still captures the per-run summary.
          LOG_LEVEL: info
          LOG_PERSIST_LEVEL: info
        run: npm run refresh:prices

      - name: Commit refreshed data
        # Persist whatever was scraped even if the step above failed partway —
        # partial progress is still useful and matches the old incremental
        # behaviour. The job is still marked failed by the failing step.
        # Skipped entirely on a dry-run (test) dispatch.
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- data; then
            echo "No data changes to commit."
            exit 0
          fi

          git add data
          git commit -m "chore(data,deploy): refresh prices $(date -u +%Y-%m-%dT%H:%MZ)"

          # main shouldn't move during a run (this is the only auto-writer, and
          # the concurrency group serialises walks), but guard against a manual
          # push landing mid-scrape: rebase our single data commit and retry.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing on latest main."
            git fetch origin main
            git rebase origin/main || {
              echo "::error::rebase conflict against main — aborting."
              exit 1
            }
          done
          echo "::error::could not push refreshed data after 3 attempts."
          exit 1
